name: Sync upstream
on:
  schedule:
    # 1× por dia às 06:00 UTC (03:00 BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync master from upstream
        run: |
          git remote add upstream https://github.com/WhiskeySockets/Baileys.git || true
          git fetch upstream master --tags
          git checkout master
          git merge --ff-only upstream/master || {
            echo "Não foi fast-forward — provavelmente fork divergiu. Crie PR manualmente."
            exit 1
          }
          git push origin master --tags
