name: Sync upstream
on:
  schedule:
    # 1× por dia às 06:00 UTC (03:00 BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:

# Mirror puro do WhiskeySockets/Baileys.
# O fork tem N commits próprios (esse arquivo + deletes de workflows
# do upstream que não rodam num mirror). Estratégia: rebase desses
# commits em cima do upstream + force-push-with-lease. Cada execução
# replica os commits fork-only em cima da última versão do upstream.
#
# Quando upstream MODIFICA um arquivo que a gente DELETOU (modify/delete
# conflict), aplicamos "delete wins" automaticamente — a intenção é
# manter o arquivo deletado independente do que upstream faça.
#
# Build do wpp-monitor usa @whiskeysockets/baileys via npm (pinned),
# o fork existe só como backup/auditoria — força-push é seguro aqui.

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Rebase fork-only commits on top of upstream
        run: |
          set -e

          git remote add upstream https://github.com/WhiskeySockets/Baileys.git || true
          # Sem --tags: GITHUB_TOKEN não pode push tags que apontem pra
          # commits que tocam .github/workflows (restrição do GitHub
          # contra abuso de token). Tags ficam no upstream mesmo.
          git fetch upstream master
          git checkout master

          # Já estamos no head do upstream? Nada a fazer.
          if [ "$(git rev-parse master)" = "$(git rev-parse upstream/master)" ]; then
            echo "Master já idêntico ao upstream. Nothing to do."
            exit 0
          fi

          # Tenta o rebase. Se conflito modify/delete, resolve "delete wins".
          if ! git rebase upstream/master; then
            while [ -d .git/rebase-merge ]; do
              # Files com modify/delete (DU = deleted by us; UD = deleted by them).
              # Em ambos os casos preservamos a intenção do nosso commit (delete).
              CONFLICTED=$(git status --porcelain | awk '/^(DU|UD) /{print $2}')

              # Se não tem modify/delete mas o rebase travou, é conflito real
              # (modificação concorrente em arquivo que tocamos) — aborta.
              if [ -z "$CONFLICTED" ]; then
                echo "::error::Conflito real em rebase (não modify/delete). Abortando."
                git status --porcelain
                git rebase --abort
                exit 1
              fi

              echo "modify/delete detectado — aplicando delete wins:"
              echo "$CONFLICTED" | while read f; do
                echo "  rm $f"
                git rm -f "$f" >/dev/null
              done

              # Continua o rebase (sem abrir editor)
              GIT_EDITOR=true git rebase --continue || break
            done

            # Se ainda em meio a rebase, falhou em continuar — aborta
            if [ -d .git/rebase-merge ]; then
              echo "::error::Não foi possível continuar o rebase após auto-resolve."
              git status
              git rebase --abort
              exit 1
            fi
          fi

      - name: Push (force-with-lease)
        run: |
          git push origin master --force-with-lease
